<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Провод от будильника вниз (красный) -->
  <path d="M 24,14 L 24,44" stroke="#CC0000" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Вилка внизу провода (красная) -->
  <rect x="20" y="42" width="8" height="4" rx="1" fill="#CC0000"/>
  <rect x="22" y="44" width="1.5" height="3" fill="#CC0000"/>
  <rect x="24.5" y="44" width="1.5" height="3" fill="#CC0000"/>

  <!-- Ножки будильника (красные) -->
  <line x1="18" y1="30" x2="14" y2="34" stroke="#E74C3C" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="30" x2="34" y2="34" stroke="#E74C3C" stroke-width="2" stroke-linecap="round"/>

  <!-- Корпус будильника (красный) -->
  <circle cx="24" cy="22" r="12" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>

  <!-- Циферблат -->
  <circle cx="24" cy="22" r="9" fill="white"/>

  <!-- Стрелки часов (показывают примерно 10:10) -->
  <line x1="24" y1="22" x2="24" y2="16" stroke="#CC0000" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="22" x2="28" y2="24" stroke="#CC0000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Точка в центре -->
  <circle cx="24" cy="22" r="1.5" fill="#CC0000"/>

  <!-- Звоночки наверху (красные, с анимацией) -->
  <circle cx="18" cy="12" r="3" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
  <circle cx="30" cy="12" r="3" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>

  <!-- Кнопка сверху будильника -->
  <rect x="23" y="8" width="2" height="4" rx="1" fill="#C0392B"/>

  <!-- Восклицательный знак (предупреждение) -->
  <text x="24" y="26" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#E74C3C" text-anchor="middle">!</text>
</svg>
